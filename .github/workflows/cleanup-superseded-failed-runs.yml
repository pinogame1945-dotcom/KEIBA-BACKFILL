name: Cleanup superseded failed workflow runs

on:
  push:
    branches:
      - ops/cleanup-failed-runs-20260929
    paths:
      - ".github/workflows/cleanup-superseded-failed-runs.yml"

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Delete all superseded failed runs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess

          repo=os.environ["REPO"]
          runs=[]
          page=1
          while True:
              p=subprocess.run(
                  ["gh","api",f"repos/{repo}/actions/runs?per_page=100&page={page}"],
                  text=True,capture_output=True,check=True
              )
              batch=json.loads(p.stdout).get("workflow_runs",[])
              if not batch:
                  break
              runs.extend(batch)
              if len(batch)<100:
                  break
              page+=1
              if page>100:
                  raise SystemExit("pagination safety stop")

          latest_success={}
          for r in runs:
              if r.get("status")=="completed" and r.get("conclusion")=="success":
                  key=(r.get("workflow_id"),r.get("head_branch"))
                  t=r.get("created_at") or ""
                  if t > latest_success.get(key,""):
                      latest_success[key]=t

          deletable=[]
          kept=[]
          for r in runs:
              if r.get("status")!="completed" or r.get("conclusion")!="failure":
                  continue
              key=(r.get("workflow_id"),r.get("head_branch"))
              success_at=latest_success.get(key)
              if success_at and success_at > (r.get("created_at") or ""):
                  deletable.append(r)
              else:
                  kept.append(r)

          deleted=0
          for r in deletable:
              rid=str(r["id"])
              subprocess.run(
                  ["gh","api","--method","DELETE",f"repos/{repo}/actions/runs/{rid}"],
                  text=True,check=True
              )
              deleted+=1
              print(f"DELETED {rid} {r.get('name','')} {r.get('head_branch','')}")

          print(f"DELETED_SUPERSEDED_FAILED_RUNS={deleted}")
          print(f"KEPT_UNSUPERSEDED_FAILED_RUNS={len(kept)}")
          for r in kept:
              print(f"KEPT {r['id']} {r.get('name','')} {r.get('head_branch','')}")
          PY

      - name: Cost guard
        if: always()
        run: |
          echo "Standard GitHub-hosted ubuntu-latest only."
          echo "No GPU, Artifact, Cache, dataset/model storage, or paid resource."
          echo "Deletes only completed failed runs that have a newer successful run for the same workflow and branch."
