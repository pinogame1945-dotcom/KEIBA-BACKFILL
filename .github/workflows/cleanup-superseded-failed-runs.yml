name: Cleanup superseded failed workflow runs

on:
  push:
    branches:
      - ops/cleanup-failed-runs-20260929
    paths:
      - ".github/workflows/cleanup-superseded-failed-runs.yml"

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Delete exact approved superseded failed runs
        shell: bash
        run: |
          set -euo pipefail
          ids=(36515393284 36515280384 36483284026 36483273789 36480672104 36265167679 36262988296 36262031317 36258909221 36258826200 36258297881 36253836503 36252222947)
          deleted=0
          for id in "${ids[@]}"; do
            echo "Deleting failed run $id"
            gh api --method DELETE "repos/$REPO/actions/runs/$id"
            deleted=$((deleted+1))
          done
          echo "DELETED_FAILED_RUNS=$deleted"

      - name: Cost guard
        if: always()
        run: |
          echo "Standard GitHub-hosted ubuntu-latest only."
          echo "No GPU, Artifact, Cache, dataset/model storage, or paid resource."
          echo "Deletes only the exact listed completed failed workflow runs."
