name: Cleanup remaining failed workflow runs

on:
  push:
    branches:
      - ops/cleanup-failed-runs-20260929
    paths:
      - ".github/workflows/cleanup-superseded-failed-runs.yml"

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Delete remaining completed failed runs
        shell: bash
        run: |
          set -euo pipefail
          ids=(36288022286 35554354159 35513383518)
          for id in "${ids[@]}"; do
            echo "Deleting failed run $id"
            gh api --method DELETE "repos/$REPO/actions/runs/$id"
          done
          echo "DELETED_REMAINING_FAILED_RUNS=3"

      - name: Cost guard
        if: always()
        run: |
          echo "Standard GitHub-hosted ubuntu-latest only."
          echo "No GPU, Artifact, Cache, dataset/model storage, or paid resource."
          echo "Deletes only the exact remaining completed failed workflow runs."
