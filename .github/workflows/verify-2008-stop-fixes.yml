name: Verify 2008 stop fixes
# rerun-after-schedule-aware-fixture

on:
  push:
    branches:
      - fix/foreign-horse-id-2008
    paths:
      - ".github/workflows/verify-2008-stop-fixes.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REQUEST_DELAY_MS: "1500"
      SCHEDULE_INTEGRITY_V2: "1"
      SKIP_EMPTY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --no-audit --no-fund
      - name: Static and smoke
        run: |
          node --check src/collect-day.mjs
          node --check src/collect-horses.mjs
          node --check src/pedigree-parser.mjs
          node --check src/collect-historical-odds.mjs
          node --check src/plan-historical-odds-backfill.mjs
          npm run smoke:pedigree
          npm run smoke:odds
          npm run smoke:odds-plan
          bash -n .github/workflows/historical-odds-backfill.yml || true
      - name: Verify alphanumeric horse ids
        shell: bash
        run: |
          node src/collect-day.mjs 2008-04-19
          node src/collect-horses.mjs --source-date 2008-04-19 --limit 2 --skip-existing 1
          node --input-type=module <<'NODE'
          import {readFile} from "node:fs/promises";
          import {gunzipSync} from "node:zlib";
          const manifest=JSON.parse(await readFile("data/manifest.json","utf8"));
          const day=manifest.days?.["2008-04-19"];
          const rows=gunzipSync(await readFile(day.file)).toString("utf8").trim().split("\n").map(JSON.parse);
          const target=[];
          for(const row of rows){
            for(const e of row.entries??[]){
              if(["000a011226","000a011220"].includes(String(e.horse_id))) target.push({
                race_id:row.race?.race_id,horse_id:e.horse_id,horse_name:e.horse_name,horse_number:e.horse_number
              });
            }
          }
          if(target.length!==2)throw new Error("alphanumeric entries not preserved: "+JSON.stringify(target));
          const packs=Object.entries(manifest.horse_packs??{})
            .filter(([,p])=>Array.isArray(p.source_horse_ids)&&p.source_horse_ids.some(id=>String(id).startsWith("000a")));
          if(!packs.length)throw new Error("alphanumeric horse pack missing");
          const records=[];
          for(const [,p] of packs){
            const text=gunzipSync(await readFile(p.file)).toString("utf8").trim();
            for(const line of text.split("\n").filter(Boolean)){
              const row=JSON.parse(line);
              if(String(row.horse_id).startsWith("000a"))records.push({
                horse_id:row.horse_id,
                horse_name:row.profile?.horse_name??null,
                pedigree_nodes:Array.isArray(row.pedigree)?row.pedigree.length:0
              });
            }
          }
          console.log("ALPHA_HORSE_VERIFY "+JSON.stringify({target,records}));
          if(records.length!==2)throw new Error("expected 2 alphanumeric horse records");
          if(records.some(r=>!r.horse_name||r.pedigree_nodes<2))throw new Error("alphanumeric profile/pedigree incomplete");
          NODE
      - name: Verify source-unavailable odds day
        shell: bash
        run: |
          node src/collect-historical-odds.mjs 2008-05-04
          node --input-type=module <<'NODE'
          import {readFile} from "node:fs/promises";
          import {spawnSync} from "node:child_process";
          const m=JSON.parse(await readFile("data/odds/manifest.json","utf8"));
          const d=m.days?.["2008-05-04"];
          console.log("ODDS_DAY_VERIFY "+JSON.stringify(d));
          if(d?.status!=="SOURCE_UNAVAILABLE")throw new Error("expected SOURCE_UNAVAILABLE");
          if(Number(d.source_races)!==36||Number(d.races)!==0||Number(d.unavailable_races)!==36)throw new Error("bad source-unavailable coverage");
          if(!Array.isArray(d.unavailable_race_details)||d.unavailable_race_details.length!==36)throw new Error("unavailable detail mismatch");
          const plan=spawnSync(process.execPath,["src/plan-historical-odds-backfill.mjs","plan","10","2007-07-28"],{encoding:"utf8"});
          if(plan.status!==0)throw new Error(plan.stderr||"planner failed");
          const parsed=JSON.parse(plan.stdout.trim());
          console.log("ODDS_PLAN_VERIFY "+JSON.stringify(parsed));
          if((parsed.selected??[]).includes("2008-05-04"))throw new Error("planner reselected terminal unavailable day");
          NODE
