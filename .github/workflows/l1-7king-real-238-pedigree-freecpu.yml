name: Original pedigree V4 238 actual 2026 features (free CPU, temporary output)
on:
  push:
    branches: [feature/7king-pedigree-schema-recovery-20261017]
    paths:
      - ml_features/research/compute_real_2026_original_pedigree_v4_238_v1.mjs
      - .github/workflows/l1-7king-real-238-pedigree-freecpu.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-pedigree:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            data/daily
            data/horses
            data/live/2026-10-17
            ml_features/delivery/690
            ml_features/research/compute_real_2026_original_pedigree_v4_238_v1.mjs
            ml_features/research/live_json_to_daily_pack_v1.py
            ml_features/research/audit_original_pedigree_v4_v1.mjs
            ml_features/src/pedigree-feature-builder-original-v4.mjs
            ml_features/src/pedigree-feature-builder.mjs
            ml_features/src/small-sample-feature-utils.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate frozen original v4 source, schema and CLI syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check ml_features/research/compute_real_2026_original_pedigree_v4_238_v1.mjs
          node ml_features/research/audit_original_pedigree_v4_v1.mjs
      - name: Convert real observed 2026-10-17 live 149 to a temporary no-results daypack
        shell: bash
        run: |
          set -euo pipefail
          python ml_features/research/live_json_to_daily_pack_v1.py \
            --live-dir data/live/2026-10-17 \
            --output "$RUNNER_TEMP/2026-10-17-pre-race.jsonl.gz"
      - name: Compute real prior-only 238 features for all 60 races / 786 horses
        shell: bash
        run: |
          set -euo pipefail
          node --max-old-space-size=5120 \
            ml_features/research/compute_real_2026_original_pedigree_v4_238_v1.mjs \
            . "$RUNNER_TEMP/pedigree-original-v4" "$RUNNER_TEMP/2026-10-17-pre-race.jsonl.gz"
      - name: Assert all required real outputs without publishing private outcome data
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'pedigree-original-v4'
          report=json.loads((root/'report.json').read_text())
          assert report['contract']=='KEIBA_ORIGINAL_V4_PEDIGREE_2026_REAL_RUN_V1'
          assert report['target']['2026-10-10']=={'races':24,'horses':315}
          assert report['target']['2026-10-17']=={'races':36,'horses':471}
          assert report['feature_count']==238 and report['feature_cells']==238*786
          assert report['historical_valid_lineage_updates']>0
          assert report['target_2026_outcomes_used'] is False
          assert report['original_v3_changed'] is False
          assert report['output_destination']=='RUNNER_TEMP_ONLY'
          for day,number in [('2026-10-10',24),('2026-10-17',36)]:
              docs=sorted((root/day).glob('*.json'))
              assert len(docs)==number
              for f in docs:
                  x=json.loads(f.read_text())
                  assert x['feature_count']==238 and not x['target_results_used']
                  for row in x['rows']:
                      ped=[k for k in row if k.startswith('ped_')]
                      assert len(ped)==238
          print('REAL_2026_PEDIGREE_V4_238_VALIDATED_60_RACES_786_HORSES')
          print(json.dumps(report,ensure_ascii=False,sort_keys=True))
          PY
