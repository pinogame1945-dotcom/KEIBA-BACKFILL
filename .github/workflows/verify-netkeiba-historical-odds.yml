name: Verify netkeiba historical odds

on:
  push:
    branches:
      - verify-netkeiba-historical-odds

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify type all
        shell: bash
        run: |
          node <<'NODE'
          const tests=[
            ["2010","201005050810"],
            ["2020","202005050912"]
          ];
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function probe(year,raceId){
            const u=new URL("https://race.netkeiba.com/api/api_get_jra_odds.html");
            for(const [k,v] of Object.entries({
              pid:"api_get_jra_odds",race_id:raceId,type:"all",action:"init",
              sort:"odds",compress:"0",output:"json"
            }))u.searchParams.set(k,v);
            const res=await fetch(u,{headers:{
              "User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36",
              "Referer":"https://race.netkeiba.com/",
              "Accept":"application/json, text/javascript, */*"
            },signal:AbortSignal.timeout(20000)});
            const text=await res.text();
            let json;
            try{json=JSON.parse(text);}catch{
              const m=text.match(/^[^(]+\((.*)\)\s*;?\s*$/s);
              if(!m)throw new Error("non-json "+text.slice(0,200));
              json=JSON.parse(m[1]);
            }
            const odds=json?.data?.odds??{};
            const groups={};
            for(const key of Object.keys(odds).sort()){
              const entries=Object.entries(odds[key]??{});
              groups[key]={count:entries.length,sample:entries[0]??null};
            }
            return {
              year,raceId,http:res.status,status:json?.status??null,
              official_datetime:json?.data?.official_datetime??null,
              groupKeys:Object.keys(odds).sort(),groups,
              responseBytes:Buffer.byteLength(text)
            };
          }
          const out=[];
          for(const t of tests){
            out.push(await probe(...t));
            await sleep(2000);
          }
          console.log("TYPE_ALL_VERIFY_START");
          console.log(JSON.stringify(out,null,2));
          console.log("TYPE_ALL_VERIFY_END");
          NODE
