name: Verify netkeiba historical odds

on:
  push:
    branches:
      - verify-netkeiba-historical-odds

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe 2007 sold trifecta races
        shell: bash
        run: |
          node <<'NODE'
          const tests=[
            ["2007-函館9R","200702020509","init"],
            ["2007-函館12R","200702020512","init"],
            ["2007-函館9R","200702020509","update"],
          ];
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function probe(label,raceId,action){
            const u=new URL("https://race.netkeiba.com/api/api_get_jra_odds.html");
            for(const [k,v] of Object.entries({
              pid:"api_get_jra_odds",race_id:raceId,type:"8",action,
              sort:"odds",compress:"0",output:"json"
            }))u.searchParams.set(k,v);
            const res=await fetch(u,{
              headers:{
                "User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36",
                "Referer":"https://race.netkeiba.com/",
                "Accept":"application/json, text/javascript, */*"
              },
              signal:AbortSignal.timeout(15000)
            });
            const text=await res.text();
            let json;
            try{json=JSON.parse(text);}catch{
              const m=text.match(/^[^(]+\((.*)\)\s*;?\s*$/s);
              if(!m)throw new Error("non-json "+text.slice(0,160));
              json=JSON.parse(m[1]);
            }
            const map=json?.data?.odds?.["8"]??{};
            const entries=Object.entries(map);
            const priced=entries.filter(([,v])=>{
              if(!Array.isArray(v))return false;
              const n=Number(String(v[0]??"").replace(/,/g,""));
              return Number.isFinite(n)&&n>0;
            });
            return {label,raceId,action,http:res.status,status:json?.status??null,total:entries.length,priced:priced.length,samples:priced.slice(0,5)};
          }
          const out=[];
          for(const t of tests){
            out.push(await probe(...t));
            await sleep(2000);
          }
          console.log("ODDS_VERIFY_2007_START");
          console.log(JSON.stringify(out,null,2));
          console.log("ODDS_VERIFY_2007_END");
          NODE
