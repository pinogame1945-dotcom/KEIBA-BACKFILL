name: Verify netkeiba historical odds

on:
  push:
    branches:
      - verify-netkeiba-historical-odds

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare sort modes
        shell: bash
        run: |
          node <<'NODE'
          const raceId="201005050810";
          const sorts=["odds","ninki",null];
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function probe(sort){
            const u=new URL("https://race.netkeiba.com/api/api_get_jra_odds.html");
            const p={pid:"api_get_jra_odds",race_id:raceId,type:"8",action:"init",compress:"0",output:"json"};
            for(const [k,v] of Object.entries(p))u.searchParams.set(k,v);
            if(sort)u.searchParams.set("sort",sort);
            const res=await fetch(u,{headers:{
              "User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36",
              "Referer":"https://race.netkeiba.com/",
              "Accept":"application/json, text/javascript, */*"
            },signal:AbortSignal.timeout(15000)});
            const text=await res.text();
            let json;
            try{json=JSON.parse(text);}catch{
              const m=text.match(/^[^(]+\((.*)\)\s*;?\s*$/s);
              if(!m)throw new Error("non-json "+text.slice(0,160));
              json=JSON.parse(m[1]);
            }
            const map=json?.data?.odds?.["8"]??{};
            const entries=Object.entries(map);
            return {
              sort:sort??"<none>",status:json?.status??null,
              official_datetime:json?.data?.official_datetime??null,
              total:entries.length,
              sample_100102:map["100102"]??null,
              sample_100201:map["100201"]??null,
              first5:entries.slice(0,5)
            };
          }
          const out=[];
          for(const sort of sorts){
            out.push(await probe(sort));
            await sleep(2000);
          }
          console.log("ODDS_SORT_COMPARE_START");
          console.log(JSON.stringify(out,null,2));
          console.log("ODDS_SORT_COMPARE_END");
          NODE
