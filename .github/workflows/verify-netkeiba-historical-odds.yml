name: Verify netkeiba historical odds

on:
  push:
    branches:
      - verify-netkeiba-historical-odds

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate 2007 final odds
        shell: bash
        run: |
          node <<'NODE'
          const raceId="200702020512",combo="071213",expected=176.7;
          const u=new URL("https://race.netkeiba.com/api/api_get_jra_odds.html");
          for(const [k,v] of Object.entries({
            pid:"api_get_jra_odds",race_id:raceId,type:"8",action:"init",
            sort:"odds",compress:"0",output:"json"
          }))u.searchParams.set(k,v);
          const res=await fetch(u,{headers:{
            "User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36",
            "Referer":"https://race.netkeiba.com/",
            "Accept":"application/json, text/javascript, */*"
          },signal:AbortSignal.timeout(15000)});
          const text=await res.text();
          let json;
          try{json=JSON.parse(text);}catch{
            const m=text.match(/^[^(]+\((.*)\)\s*;?\s*$/s);
            json=JSON.parse(m[1]);
          }
          const raw=json?.data?.odds?.["8"]?.[combo]??null;
          console.log("VERIFY_2007_FINAL_START");
          console.log(JSON.stringify({
            raceId,combo,expectedFromPayout:expected,status:json?.status??null,
            official_datetime:json?.data?.official_datetime??null,raw,
            matches:Array.isArray(raw)?raw.map((x,i)=>({index:i,value:Number(String(x).replace(/,/g,""))})).filter(x=>Number.isFinite(x.value)&&Math.abs(x.value-expected)<1e-9):[]
          },null,2));
          console.log("VERIFY_2007_FINAL_END");
          NODE
