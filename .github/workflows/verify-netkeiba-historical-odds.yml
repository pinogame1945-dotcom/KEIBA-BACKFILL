name: Verify netkeiba historical odds

on:
  push:
    branches:
      - verify-netkeiba-historical-odds

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe historical final odds
        shell: bash
        run: |
          node <<'NODE'
          const races = [
            ["2025","202505021201"],
            ["2020","202005050912"],
            ["2015","201505021201"],
            ["2010","201005050810"],
            ["2007","200702020504"],
          ];
          const types = [1,3,4,5,6,7,8];
          const sleep = ms => new Promise(r=>setTimeout(r,ms));
          async function probe(raceId,type,action="init"){
            const u = new URL("https://race.netkeiba.com/api/api_get_jra_odds.html");
            u.searchParams.set("pid","api_get_jra_odds");
            u.searchParams.set("race_id",raceId);
            u.searchParams.set("type",String(type));
            u.searchParams.set("action",action);
            u.searchParams.set("sort","odds");
            u.searchParams.set("compress","0");
            u.searchParams.set("output","json");
            let last;
            for(let attempt=1;attempt<=3;attempt++){
              try{
                const res=await fetch(u,{
                  headers:{
                    "User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36",
                    "Referer":"https://race.netkeiba.com/",
                    "Accept":"application/json, text/javascript, */*"
                  },
                  signal:AbortSignal.timeout(20000)
                });
                const text=await res.text();
                if(!res.ok) throw new Error("HTTP "+res.status+" body="+text.slice(0,120));
                let json;
                try{ json=JSON.parse(text); }
                catch{
                  const m=text.match(/^[^(]+\((.*)\)\s*;?\s*$/s);
                  if(!m) throw new Error("non-json body="+text.slice(0,160));
                  json=JSON.parse(m[1]);
                }
                const odds=json?.data?.odds??{};
                const keys = type===1 ? ["1","2"] : [String(type)];
                const counts={};
                const samples={};
                for(const k of keys){
                  const map=odds?.[k];
                  const entries=map&&typeof map==="object"&&!Array.isArray(map)?Object.entries(map):[];
                  const priced=entries.filter(([,v])=>{
                    if(!Array.isArray(v)) return false;
                    const n=Number(String(v[0]??"").replace(/,/g,""));
                    return Number.isFinite(n)&&n>0;
                  });
                  counts[k]={total:entries.length,priced:priced.length};
                  samples[k]=priced.slice(0,3).map(([combo,v])=>[combo,v?.[0],v?.[1]]);
                }
                return {ok:true,http:res.status,status:json?.status??null,counts,samples};
              }catch(e){
                last=String(e?.message??e);
                if(attempt<3) await sleep(1500);
              }
            }
            return {ok:false,error:last};
          }

          const results=[];
          for(const [year,raceId] of races){
            const r=await probe(raceId,8,"init");
            results.push({year,raceId,type:8,action:"init",...r});
            await sleep(2000);
          }
          for(const [year,raceId] of [races[0],races[races.length-1]]){
            for(const type of types){
              if(type===8) continue;
              const r=await probe(raceId,type,"init");
              results.push({year,raceId,type,action:"init",...r});
              await sleep(2000);
            }
          }
          for(const [year,raceId] of [races[1],races[races.length-1]]){
            const r=await probe(raceId,8,"update");
            results.push({year,raceId,type:8,action:"update",...r});
            await sleep(2000);
          }

          console.log("ODDS_VERIFY_RESULT_START");
          console.log(JSON.stringify(results,null,2));
          console.log("ODDS_VERIFY_RESULT_END");

          const failures=results.filter(x=>!x.ok);
          if(failures.length) process.exitCode=2;
          NODE
