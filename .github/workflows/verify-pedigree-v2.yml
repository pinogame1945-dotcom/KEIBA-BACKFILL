name: Verify pedigree parser v2

on:
  push:
    branches:
      - pedigree-v2-fix
    paths:
      - ".verify-pedigree-v2"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --no-audit --no-fund
      - run: npm run smoke:pedigree
      - run: npm run smoke:odds && npm run smoke:odds-plan
