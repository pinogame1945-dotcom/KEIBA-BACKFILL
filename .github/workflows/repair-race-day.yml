name: Repair one race day

on:
  push:
    branches: [main]
    paths:
      - ".backfill/repair-race-day-kick"

permissions:
  contents: write

concurrency:
  group: keiba-historical-week-production
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REQUEST_DELAY_MS: "1500"
      SCHEDULE_INTEGRITY_V2: "1"
      FORCE_RECOLLECT_CURRENT: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Resolve repair date
        id: input
        shell: bash
        run: |
          set -euo pipefail
          DATE=$(sed -n 's/^date=//p' .backfill/repair-race-day-kick | tail -1)
          if [[ ! "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "invalid repair date: $DATE"
            exit 1
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "Repair target: $DATE"

      - name: Regression gate
        run: |
          node --check src/collect-day.mjs
          node --check src/verify-range.mjs
          npm run smoke:payout
          npm run smoke:schedule
          bash -n scripts/push-main-with-retry.sh

      - name: Recollect race day
        shell: bash
        run: |
          set -euo pipefail
          DATE="${{ steps.input.outputs.date }}"
          node src/collect-day.mjs "$DATE"
          node --input-type=module - "$DATE" <<'NODE'
          import {readFile,writeFile} from "node:fs/promises";
          const date=process.argv[2];
          const path="data/manifest.json";
          const manifest=JSON.parse(await readFile(path,"utf8"));
          const day=manifest.days?.[date];
          if(!day||day.status!=="SUCCESS")throw new Error("repaired day not SUCCESS: "+date);
          day.updated_at=new Date().toISOString();
          day.repair_reason="PAYOUT_POPULARITY_NONPOSITIVE";
          await writeFile(path,JSON.stringify(manifest,null,2)+"\n");
          NODE
          node src/verify-range.mjs "$DATE" "$DATE"

      - name: Commit repaired race day
        shell: bash
        run: |
          set -euo pipefail
          DATE="${{ steps.input.outputs.date }}"
          git config user.name "keiba-backfill-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "data/daily/$DATE.jsonl.gz" data/manifest.json
          if git diff --cached --quiet; then
            echo "No repair changes."
            exit 0
          fi
          git commit -m "data: repair race pack $DATE"
          bash scripts/push-main-with-retry.sh
