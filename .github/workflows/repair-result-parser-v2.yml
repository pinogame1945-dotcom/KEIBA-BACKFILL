name: Repair result parser v2

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Newest date (YYYY-MM-DD)"
        required: true
        default: "2026-05-17"
      end_date:
        description: "Oldest date (YYYY-MM-DD)"
        required: true
        default: "2026-05-17"
  push:
    branches: [main]
    paths:
      - ".backfill/result-repair-kick.json"

permissions:
  contents: write

concurrency:
  group: keiba-historical-week-production
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      REQUEST_DELAY_MS: "1500"
      SCHEDULE_INTEGRITY_V2: "1"
      SKIP_EMPTY: "1"
      REBUILD_RESULT_PARSER_V1: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: npm install --no-audit --no-fund

      - name: Resolve range
        id: range
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            START="${{ inputs.start_date }}"
            END="${{ inputs.end_date }}"
          else
            START=$(jq -r '.start_date' .backfill/result-repair-kick.json)
            END=$(jq -r '.end_date' .backfill/result-repair-kick.json)
          fi
          if [[ ! "$START" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || [[ ! "$END" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid range: $START -> $END"
            exit 1
          fi
          if [[ "$START" < "$END" ]]; then
            echo "start_date must be newest and >= end_date"
            exit 1
          fi
          echo "start=$START" >> "$GITHUB_OUTPUT"
          echo "end=$END" >> "$GITHUB_OUTPUT"

      - name: Repair dates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "keiba-backfill-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          START="${{ steps.range.outputs.start }}"
          END="${{ steps.range.outputs.end }}"
          DATE="$START"

          while true; do
            echo "========================================"
            echo "RESULT PARSER REPAIR $DATE"
            echo "========================================"
            node src/collect-day.mjs "$DATE"
            if [ -f "data/daily/$DATE.jsonl.gz" ]; then
              node scripts/audit-result-quality.mjs "$DATE"
            fi
            git add data/manifest.json data/daily/ data/debug/ 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -m "data: repair result parser v2 $DATE"
              git pull --rebase origin main
              git push
            fi
            if [ "$DATE" = "$END" ]; then break; fi
            DATE=$(date -I -d "$DATE - 1 day")
            if [[ "$DATE" < "$END" ]]; then
              echo "Date range guard triggered"
              exit 1
            fi
          done

      - name: Audit repository
        run: node scripts/audit-result-quality.mjs
