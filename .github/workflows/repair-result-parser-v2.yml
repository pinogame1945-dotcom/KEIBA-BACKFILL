name: Repair stale race packs

on:
  workflow_dispatch:
    inputs:
      newest_date:
        description: "Newest existing SUCCESS day eligible for repair"
        required: true
        default: "2026-09-20"
      oldest_date:
        description: "Oldest existing SUCCESS day eligible for repair"
        required: true
        default: "2006-09-01"
      max_repairs:
        description: "Maximum stale meeting days to repair in this run (1-20)"
        required: true
        default: "10"

permissions:
  contents: write

concurrency:
  group: keiba-historical-week-production
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      REQUEST_DELAY_MS: "1500"
      SCHEDULE_INTEGRITY_V2: "1"
      SKIP_EMPTY: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate repair source
        run: |
          node --check src/collect-day.mjs
          node --check src/verify-range.mjs
          node --check src/plan-race-pack-repair.mjs
          npm run smoke:result-columns
          npm run smoke:result-quality
          npm run smoke:race-meta
          npm run smoke:lap
          npm run smoke:schedule
          npm run smoke:repair-plan
          npm run smoke:workflow-safety

      - name: Plan stale meeting days
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          NEWEST="${{ inputs.newest_date }}"
          OLDEST="${{ inputs.oldest_date }}"
          MAX="${{ inputs.max_repairs }}"
          node src/plan-race-pack-repair.mjs "$NEWEST" "$OLDEST" "$MAX" | tee /tmp/race-pack-repair-plan.json
          SELECTED=$(jq -r '.selected_days' /tmp/race-pack-repair-plan.json)
          echo "selected=$SELECTED" >> "$GITHUB_OUTPUT"

      - name: Repair selected meeting days
        if: ${{ steps.plan.outputs.selected != '0' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "keiba-backfill-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mapfile -t DATES < <(jq -r '.dates[].date' /tmp/race-pack-repair-plan.json)
          for DATE in "${DATES[@]}"; do
            echo "========================================"
            echo "RACE PACK REPAIR $DATE"
            echo "========================================"

            git pull --rebase origin main
            node src/collect-day.mjs "$DATE"
            node scripts/audit-result-quality.mjs "$DATE"
            node src/verify-range.mjs "$DATE" "$DATE"

            git add data/manifest.json data/daily/ data/debug/ 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -m "data: repair current race pack $DATE"
              git pull --rebase origin main
              git push
            else
              echo "No data changes for $DATE."
            fi
          done

      - name: Report remaining stale packs
        shell: bash
        run: |
          set -euo pipefail
          node src/plan-race-pack-repair.mjs             "${{ inputs.newest_date }}"             "${{ inputs.oldest_date }}"             "20"
