name: Probe empty discovery

on:
  push:
    branches:
      - ci/probe-empty-discovery

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REQUEST_DELAY_MS: "1500"
      DEBUG_DISCOVERY: "1"
      SKIP_EMPTY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --no-audit --no-fund
      - run: node src/collect-day.mjs 2026-09-18
      - if: always()
        run: cat data/debug/2026-09-18.json
