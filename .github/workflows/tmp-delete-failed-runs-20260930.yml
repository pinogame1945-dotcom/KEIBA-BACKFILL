name: Remove failed backfill runs

on:
  push:
    branches:
      - fix/foreign-horse-id-2008
    paths:
      - ".github/workflows/tmp-delete-failed-runs-20260930.yml"

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete exact failed runs
        shell: bash
        run: |
          set -euo pipefail
          for id in 36599781637 36564776719; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id"
            echo "DELETED=$id"
          done
      - name: Cost guard
        if: always()
        run: |
          echo "standard ubuntu-latest only"
          echo "no gpu, artifact, cache, paid compute, or paid storage"
