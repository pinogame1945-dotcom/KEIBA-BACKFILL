name: Historical week production
# trigger-week-005-payout-v2

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Newest date (YYYY-MM-DD)"
        required: true
        default: "2026-09-04"
      end_date:
        description: "Oldest date (YYYY-MM-DD)"
        required: true
        default: "2026-08-22"
  push:
    branches: [main]
    paths:
      - ".backfill/week-kick"

permissions:
  contents: write
  actions: write

concurrency:
  group: keiba-historical-week-production
  cancel-in-progress: false

jobs:
  collect-week:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      REQUEST_DELAY_MS: "1500"
      SCHEDULE_INTEGRITY_V2: "1"
      SKIP_EMPTY: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Resolve range
        id: input
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            START="${{ inputs.start_date }}"
            END="${{ inputs.end_date }}"
          elif [ -f ".backfill/week-kick" ]; then
            START=$(jq -r '.start_date // empty' .backfill/week-kick)
            END=$(jq -r '.end_date // empty' .backfill/week-kick)
          else
            echo "Push-triggered backfill requires .backfill/week-kick with start_date/end_date."
            exit 1
          fi

          if [[ ! "$START" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || [[ ! "$END" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid resolved range: $START -> $END"
            exit 1
          fi
          if [[ "$START" < "$END" ]]; then
            echo "Resolved start_date must be newest and >= end_date: $START -> $END"
            exit 1
          fi

          echo "Resolved historical range: $START -> $END"
          echo "start=$START" >> "$GITHUB_OUTPUT"
          echo "end=$END" >> "$GITHUB_OUTPUT"

      - name: Backfill dates newest to oldest
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          START="${{ steps.input.outputs.start }}"
          END="${{ steps.input.outputs.end }}"
          DATE="$START"

          git config user.name "keiba-backfill-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          while true; do
            echo "========================================"
            echo "BACKFILL DATE $DATE"
            echo "========================================"

            node src/collect-day.mjs "$DATE"

            if [ -f "data/daily/$DATE.jsonl.gz" ]; then
              for i in $(seq 1 20); do
                BEFORE=$(node --input-type=module - "$DATE" <<'NODE'
          import {readFile} from "node:fs/promises";
          import {gunzipSync} from "node:zlib";
          const date=process.argv[2];
          const manifest=JSON.parse(await readFile("data/manifest.json","utf8"));
          const completed=new Set();
          for(const p of Object.values(manifest.horse_packs??{})){
            if(p.status!=="SUCCESS")continue;
            if(Number(p.horse_pack_version??0)<2)continue;
            if(Number(p.pedigree_parser_version??0)<2)continue;
            for(const id of p.source_horse_ids??[])completed.add(String(id));
          }
          const text=gunzipSync(await readFile(`data/daily/${date}.jsonl.gz`)).toString("utf8").trim();
          const day=new Set();
          for(const line of text.split("\n").filter(Boolean)){
            const row=JSON.parse(line);
            for(const e of row.entries??[])if(e.horse_id)day.add(String(e.horse_id));
          }
          console.log([...day].filter(id=>!completed.has(id)).length);
          NODE
          )
                echo "Pending before batch $i on $DATE: $BEFORE"
                if [ "$BEFORE" = "0" ]; then
                  break
                fi
                node src/collect-horses.mjs --source-date "$DATE" --limit 50 --skip-existing 1
              done

              node --input-type=module - "$DATE" <<'NODE'
          import {readFile} from "node:fs/promises";
          import {gunzipSync} from "node:zlib";
          const date=process.argv[2];
          const manifest=JSON.parse(await readFile("data/manifest.json","utf8"));
          const dayEntry=manifest.days?.[date];
          if(!dayEntry||dayEntry.status!=="SUCCESS")throw new Error("missing SUCCESS day "+date);
          const text=gunzipSync(await readFile(dayEntry.file)).toString("utf8").trim();
          const rows=text?text.split("\n").map(JSON.parse):[];
          if(rows.length!==dayEntry.races_parsed)throw new Error("daily race count mismatch "+date);

          const dayHorseIds=new Set();
          for(const row of rows){
            for(const e of row.entries??[])if(e.horse_id)dayHorseIds.add(String(e.horse_id));
          }

          const allHorseIds=new Set();
          const byParser=new Map();
          for(const p of Object.values(manifest.horse_packs??{})){
            if(p.status!=="SUCCESS")continue;
            if(Number(p.horse_pack_version??0)<2)continue;
            if(Number(p.pedigree_parser_version??0)<2)continue;
            const version=Number(p.pedigree_parser_version??1);
            let seen=byParser.get(version);
            if(!seen){seen=new Set();byParser.set(version,seen);}
            for(const id of p.source_horse_ids??[]){
              const value=String(id);
              if(seen.has(value))throw new Error("duplicate horse in pedigree parser v"+version+": "+value);
              seen.add(value);
              allHorseIds.add(value);
            }
          }

          const missing=[...dayHorseIds].filter(id=>!allHorseIds.has(id));
          if(missing.length)throw new Error(`missing ${missing.length} horses for ${date}`);
          console.log({
            date,
            races:rows.length,
            dayUniqueHorses:dayHorseIds.size,
            totalHorseMaster:allHorseIds.size,
            missing:0
          });
          NODE
            else
              echo "No JRA meeting on $DATE; skipped."
            fi

            git add data/manifest.json data/daily/ data/horses/ data/debug/ 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -m "data: backfill historical day $DATE"
              git pull --rebase origin main
              git push
            else
              echo "No data changes for $DATE."
            fi

            if [ "$DATE" = "$END" ]; then
              break
            fi
            DATE=$(date -I -d "$DATE - 1 day")
            if [[ "$DATE" < "$END" ]]; then
              echo "Date range guard triggered."
              exit 1
            fi
          done

      - name: Final summary
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from "node:fs/promises";
          const manifest=JSON.parse(await readFile("data/manifest.json","utf8"));
          const ids=new Set();
          let measured=0;
          let weighted=0;
          for(const p of Object.values(manifest.horse_packs??{})){
            if(p.status!=="SUCCESS")continue;
            for(const id of p.source_horse_ids??[])ids.add(String(id));
            if(p.timing?.measured_horses){
              measured+=p.timing.measured_horses;
              weighted+=p.timing.average_ms_per_horse*p.timing.measured_horses;
            }
          }
          console.log({
            raceDays:Object.keys(manifest.days??{}).length,
            horsePacks:Object.keys(manifest.horse_packs??{}).length,
            uniqueHorses:ids.size,
            measuredHorses:measured,
            weightedAverageMsPerHorse:measured?Math.round(weighted/measured):null
          });
          NODE

      - name: Verify completed range
        shell: bash
        run: |
          set -euo pipefail
          node src/verify-range.mjs \
            "${{ steps.input.outputs.start }}" \
            "${{ steps.input.outputs.end }}"

      - name: Kick independent odds catch-up
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -f ".backfill/odds-auto-enabled" ]; then
            echo "Historical odds auto-follow is disabled; skip automatic kick."
            exit 0
          fi
          git pull --rebase origin main
          PLAN=$(node src/plan-historical-odds-backfill.mjs plan 10 2007-07-28)
          PENDING=$(printf '%s' "$PLAN" | jq -r '.pending_days')
          if [ "$PENDING" = "0" ]; then
            echo "No pending odds days."
            exit 0
          fi

          OTHER_ACTIVE=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/historical-odds-backfill.yml/runs?per_page=30" \
            --jq "[.workflow_runs[] | select(.status == \"queued\" or .status == \"in_progress\")] | length")
          if [ "$OTHER_ACTIVE" != "0" ]; then
            echo "Odds catch-up already active/queued; skip duplicate dispatch."
            exit 0
          fi

          echo "Kick odds catch-up; pending=$PENDING"
          gh workflow run historical-odds-backfill.yml \
            --ref main \
            -f max_days="10" \
            -f min_date="2007-07-28"

      - name: Self-chain next historical range
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          START="${{ steps.input.outputs.start }}"
          END="${{ steps.input.outputs.end }}"

          git config user.name "keiba-backfill-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

          PLAN=$(node src/chain-next-range.mjs prepare "$START" "$END" "$GITHUB_RUN_ID")
          echo "$PLAN"
          ACTION=$(printf '%s' "$PLAN" | jq -r '.action')

          if [ "$ACTION" = "stop" ] || [ "$ACTION" = "already-dispatched" ]; then
            echo "Self-chain stopped: $ACTION"
            exit 0
          fi

          if [ "$ACTION" = "terminal" ]; then
            git add .backfill/state.json
            if ! git diff --cached --quiet; then
              git commit -m "ci: mark historical backfill terminal range"
              git pull --rebase origin main
              git push
            fi
            echo "Historical backfill reached configured stop date."
            exit 0
          fi

          if [ "$ACTION" != "dispatch" ]; then
            echo "Unexpected chain action: $ACTION"
            exit 1
          fi

          NEXT_START=$(printf '%s' "$PLAN" | jq -r '.next_start')
          NEXT_END=$(printf '%s' "$PLAN" | jq -r '.next_end')

          git add .backfill/state.json
          if ! git diff --cached --quiet; then
            git commit -m "ci: prepare next historical range $NEXT_START to $NEXT_END"
            git pull --rebase origin main
            git push
          fi

          OTHER_ACTIVE=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/historical-week-production.yml/runs?per_page=30" \
            --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID and (.status == \"queued\" or .status == \"in_progress\"))] | length")
          if [ "$OTHER_ACTIVE" != "0" ]; then
            echo "Another historical-week run is already queued or active; refusing duplicate dispatch."
            exit 1
          fi

          echo "Dispatching next historical range: $NEXT_START -> $NEXT_END"
          gh workflow run historical-week-production.yml \
            --ref main \
            -f start_date="$NEXT_START" \
            -f end_date="$NEXT_END"

          node src/chain-next-range.mjs mark-dispatched "$START" "$END" "$GITHUB_RUN_ID"
          git add .backfill/state.json
          git commit -m "ci: mark next historical range dispatched $NEXT_START to $NEXT_END"
          git pull --rebase origin main
          git push