name: Validate current main 20260912

on:
  push:
    branches:
      - ci/validate-current-main-20260912

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate current main data
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from "node:fs/promises";
          import {gunzipSync} from "node:zlib";
          const manifest=JSON.parse(await readFile("data/manifest.json","utf8"));
          const seen=new Set();
          let packs=0, horses=0;
          for(const [name,p] of Object.entries(manifest.horse_packs??{})){
            if(p.status!=="SUCCESS")continue;
            packs++;
            const text=gunzipSync(await readFile(p.file)).toString("utf8").trim();
            const rows=text?text.split("\n").map(JSON.parse):[];
            if(rows.length!==p.records)throw new Error(`pack count mismatch ${name}`);
            for(const row of rows){
              const id=String(row.horse_id??"");
              if(!id)throw new Error(`horse id missing in ${name}`);
              if(seen.has(id))throw new Error(`duplicate horse ${id}`);
              seen.add(id); horses++;
              if(!Array.isArray(row.pedigree)||row.pedigree.length!==62)throw new Error(`incomplete pedigree ${id}`);
              const pos=new Set(row.pedigree.map(n=>`${n.generation}:${n.slot}`));
              if(pos.size!==62)throw new Error(`pedigree positions invalid ${id}`);
            }
          }
          const day=manifest.days?.["2026-09-12"];
          if(!day||day.status!=="SUCCESS")throw new Error("2026-09-12 missing SUCCESS");
          const dtext=gunzipSync(await readFile(day.file)).toString("utf8").trim();
          const races=dtext?dtext.split("\n").map(JSON.parse):[];
          if(races.length!==24||races.length!==day.races_parsed)throw new Error(`2026-09-12 race count ${races.length}`);
          for(const row of races){
            for(const e of row.entries??[])if(e.horse_id&&!seen.has(String(e.horse_id)))throw new Error(`missing master horse ${e.horse_id}`);
          }
          console.log({packs,horses,uniqueHorses:seen.size,date:"2026-09-12",races:races.length,allPedigreesComplete:true,duplicateHorses:0});
          NODE
