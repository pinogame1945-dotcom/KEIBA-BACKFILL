name: Publish eight-ticket odds alongside 690 feature race IDs
on:
  push:
    branches: [feature/690-plus-odds-handoff-20261017]
    paths:
      - ml_features/trigger-690-plus-odds-delivery.txt
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: backfill-690-odds-handoff-public-git
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate schema and safety tests before publication
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile ml_features/research/export_odds_delivery_v1.py
          python -m py_compile ml_features/research/fetch_features_and_odds_for_ml_v1.py
          python -m unittest discover -s ml_features/tests -p test_odds_handoff_v1.py -v
          test "$(df -Pk "$RUNNER_TEMP" | awk 'NR==2{print $4}')" -ge 5000000
          echo "STANDARD_PUBLIC_GITHUB_CPU_NO_ARTIFACT_LFS_CACHE_OR_PAID_STORAGE"
      - name: Prepare existing feature handoff branch (no main writes)
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin handoff/690-feature-data-v1
          git worktree add --detach "$RUNNER_TEMP/paired" FETCH_HEAD
          echo "PAIRED=$RUNNER_TEMP/paired" >> "$GITHUB_ENV"
          git -C "$RUNNER_TEMP/paired" config user.name github-actions-bot
          git -C "$RUNNER_TEMP/paired" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          cp ml_features/research/fetch_features_and_odds_for_ml_v1.py \
            "$RUNNER_TEMP/paired/ml_features/fetch_features_and_odds_for_ml_v1.py"
      - name: Export 10 October FINAL eight-ticket odds and publish checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python ml_features/research/export_odds_delivery_v1.py \
            --date 2026-10-10 --source-root . --out-root "$PAIRED"
          test "$(find "$PAIRED/ml_features/delivery/odds/2026-10-10" -name '*.json' | wc -l)" -eq 24
          git -C "$PAIRED" add ml_features/delivery/odds ml_features/fetch_features_and_odds_for_ml_v1.py
          git -C "$PAIRED" commit -m "data(handoff): publish Oct10 24 final odds with 690 feature references"
          git -C "$PAIRED" push origin HEAD:refs/heads/handoff/690-feature-data-v1
          echo "OCT10_FINAL_24_ODDS_GIT_PUBLISHED"
      - name: Export 17 October JRA LIVE eight-ticket odds and publish checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python ml_features/research/export_odds_delivery_v1.py \
            --date 2026-10-17 --source-root . --out-root "$PAIRED"
          test "$(find "$PAIRED/ml_features/delivery/odds/2026-10-17" -name '*.json' | wc -l)" -eq 36
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["PAIRED"])/"ml_features/delivery/odds/index.json"
          a=json.loads(p.read_text())
          assert a["total_races"]==60
          assert sum(x["source"]=="NETKEIBA_FINAL" for x in a["races"].values())==24
          assert sum(x["source"]=="JRA_OFFICIAL_POST" for x in a["races"].values())==36
          print("ODDS_INDEX_60_RACE_SOURCE_TYPES_VERIFIED")
          PY
          test "$(du -sm "$PAIRED/ml_features/delivery/odds" | awk '{print $1}')" -lt 75
          git -C "$PAIRED" add ml_features/delivery/odds ml_features/fetch_features_and_odds_for_ml_v1.py
          git -C "$PAIRED" commit -m "data(handoff): publish Oct17 36 live odds plus 60-race odds index"
          git -C "$PAIRED" push origin HEAD:refs/heads/handoff/690-feature-data-v1
          echo "OCT17_LIVE_36_ODDS_GIT_PUBLISHED"
      - name: Prove race ID directly retrieves matched 690 and 8 ticket odds
        shell: bash
        run: |
          set -euo pipefail
          BASE="file://$PAIRED/"
          python ml_features/research/fetch_features_and_odds_for_ml_v1.py \
            --race-id 202605040301 --base-url "$BASE" --output "$RUNNER_TEMP/paired-oct10.json"
          python ml_features/research/fetch_features_and_odds_for_ml_v1.py \
            --race-id 202604040101 --base-url "$BASE" --output "$RUNNER_TEMP/paired-oct17.json"
          git -C "$PAIRED" fetch origin handoff/690-feature-data-v1
          test "$(git -C "$PAIRED" rev-parse HEAD)" = "$(git -C "$PAIRED" rev-parse FETCH_HEAD)"
          echo "ML_ONE_RACE_ID_PAIR_READ_OK_60_INDEXED_NO_ARTIFACT_OR_CACHE"
