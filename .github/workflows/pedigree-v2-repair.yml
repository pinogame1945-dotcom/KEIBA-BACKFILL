name: Pedigree v2 repair

on:
  workflow_dispatch:
    inputs:
      source_date:
        description: "Existing race-pack date to repair (YYYY-MM-DD)"
        required: true
        default: "2026-09-20"
      batches:
        description: "100-horse pedigree-only repair batches in this run (1-4)"
        required: true
        default: "1"

permissions:
  contents: write

concurrency:
  group: keiba-pedigree-v2-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REQUEST_DELAY_MS: "1500"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --no-audit --no-fund
      - name: Parser contract
        run: npm run smoke:pedigree
      - name: Recollect pedigree safely
        shell: bash
        run: |
          set -euo pipefail
          DATE="${{ inputs.source_date }}"
          BATCHES="${{ inputs.batches }}"
          if ! [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "invalid source_date"
            exit 1
          fi
          if ! [[ "$BATCHES" =~ ^[1-4]$ ]]; then
            echo "batches must be 1..4"
            exit 1
          fi
          for i in $(seq 1 "$BATCHES"); do
            echo "pedigree v2 repair batch $i/$BATCHES for $DATE"
            node src/repair-pedigree-v2.mjs --source-date "$DATE" --limit 100
          done
      - name: Validate repaired date
        shell: bash
        run: node src/verify-range.mjs "${{ inputs.source_date }}" "${{ inputs.source_date }}"
      - name: Commit repair packs
        shell: bash
        run: |
          git config user.name "keiba-backfill-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/manifest.json data/horses/ data/debug/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No repair data changes."
            exit 0
          fi
          git commit -m "data: add pedigree v2 repair packs for ${{ inputs.source_date }}"
          git pull --rebase origin main
          git push
